<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CyberKnight — PM Module 01 Sample</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 900; src: url(node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2) format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 300; src: url(node_modules/@fontsource/poppins/files/poppins-latin-300-normal.woff2) format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 400; src: url(node_modules/@fontsource/poppins/files/poppins-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 500; src: url(node_modules/@fontsource/poppins/files/poppins-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 600; src: url(node_modules/@fontsource/poppins/files/poppins-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "JBMono"; font-weight: 400; src: url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "JBMono"; font-weight: 700; src: url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }

  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #stage > * { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #svg { display: block; }
  #type, #hud { pointer-events: none; }
  #type > *, #hud > * { position: absolute; }
  .h { font-family: "Inter", Helvetica, Arial, sans-serif; font-weight: 800; color: #fff; letter-spacing: -0.02em; line-height: 0.92; white-space: nowrap; }
  .b { font-family: "Poppins", sans-serif; font-weight: 400; color: #fff; letter-spacing: 0.02em; white-space: nowrap; }
  .m { font-family: "JBMono", monospace; font-weight: 400; color: #fff; letter-spacing: 0.08em; white-space: nowrap; text-transform: uppercase; }
  .red { color: #DB0923; }
  .ko { text-shadow: 0.06em -0.08em 0 #CD0A21; }           /* knight-offset: the logo's red glitch shadow */
  .mask { overflow: hidden; display: inline-block; vertical-align: top; }
  #vignette { background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  #flash { background: #fff; opacity: 0; mix-blend-mode: normal; }
  #grain { opacity: 0.14; mix-blend-mode: overlay; }
  #scan { background: repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="footage" width="1920" height="1080"></canvas>
  <svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="type"></div>
  <div id="hud"></div>
  <div id="scan"></div>
  <div id="vignette"></div>
  <canvas id="grain" width="960" height="540" style="width:1920px;height:1080px"></canvas>
  <div id="flash"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
